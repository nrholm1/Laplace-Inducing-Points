model:
  name:                  MiniCNN
  type:                  classifier
  seed:                  1337_420
  # MiniCNN-specific
  c1:                    8
  c2:                    16
  num_classes:           10
  checkpoint:            false

optimization:
  full_set_size:         58_800
  alpha:                 0.0001

  map:
    lr:                  0.001
    seed:                32132132
    epochs:              500
    batch_size:          128

  ip:
    m:                   10
    batch_size:          256

    epochs:              100
    lr:                  0.03
    seed:                1234

    # Used for inference MC
    mc_samples:          1000

    # Fraction of Z used per substep when masking
    ip_batch_frac:       1.0

    # Stochastic-trace and SLQ settings
    st_samples:          32
    slq_samples:         32
    slq_num_matvecs:     16

    # Optional: interleaved alpha tuning
    alpha_steps_every:   10
    alpha_steps_burnin:  20
    alpha_steps_per_call: 0